<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="site"><span id="hostname"></span></div>
    <div id="buttons"></div>
    <label class="threshold" for="rtlThreshold">
      <span class="threshold-label">
        RTL character threshold
        <span
          class="threshold-help"
          tabindex="0"
          role="img"
          aria-label="Minimum percentage of directional letters that must be Hebrew, Arabic, or Persian for Auto mode to make the text RTL. Lower values allow more Latin text. This setting is saved separately for each site."
          data-tooltip="The minimum share of Hebrew, Arabic, or Persian letters needed to make text RTL. Lower values allow more Latin text. Saved separately for each site."
        >?</span>
      </span>
      <output id="rtlThresholdValue" for="rtlThreshold">50%</output>
      <input
        id="rtlThreshold"
        type="range"
        min="1"
        max="100"
        step="1"
        value="50"
      />
    </label>
    <label class="default-toggle">
      <input type="checkbox" id="autoDefault" />
      Auto by default
    </label>
    <div class="footer">
      <span>v<span id="version"></span></span>
      <button
        id="reportBtn"
        type="button"
        aria-controls="reportDesc"
        aria-expanded="false"
      >
        Report an issue
      </button>
    </div>
    <textarea
      id="reportDesc"
      rows="3"
      maxlength="2000"
      aria-label="Describe what's not working (optional)"
      placeholder="What's not working? (optional)"
    ></textarea>
    <div id="reportStatus"></div>
    <script src="popup.js"></script>
  </body>
</html>
