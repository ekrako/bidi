name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Verify manifest version is bumped above main
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          base="$(git show origin/main:manifest.json | jq -r .version)"
          head="$(jq -r .version manifest.json)"
          highest="$(printf '%s\n%s\n' "$base" "$head" | sort -V | tail -n1)"
          if [ "$base" = "$head" ] || [ "$highest" != "$head" ]; then
            echo "::error file=manifest.json::manifest version ($head) must be higher than main ($base). Bump it before merging."
            exit 1
          fi
          echo "manifest version OK: $head > $base"

      - name: Install dependencies
        run: bun install

      - name: Run tests
        run: bun test

      - name: Build
        run: bun run build
